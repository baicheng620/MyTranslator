<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 260px; padding: 15px; font-family: 'Segoe UI', sans-serif; background: #f9f9f9; }
    h3 { margin: 0 0 15px 0; text-align: center; color: #333; font-size: 16px; }
    .row { margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; font-weight: bold; }
    select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; background: white; }
    button {
      width: 100%; padding: 10px;
      background: #4285f4; color: white;
      border: none; border-radius: 4px;
      cursor: pointer; font-size: 14px; font-weight: bold;
      margin-top: 5px;
      transition: background 0.2s;
    }
    button:hover { background: #357ae8; }
    .btn-secondary { background: #fff; color: #555; border: 1px solid #ccc; }
    .btn-secondary:hover { background: #f0f0f0; }
    #status { font-size: 12px; color: #888; margin-top: 10px; text-align: center; min-height: 18px;}
  </style>
</head>
<body>
  <h3>🌐 网页翻译 Pro</h3>
  
  <div class="row">
    <label>原文语言</label>
    <select id="sourceLang">
      <option value="auto">自动检测</option>
      <option value="en">英语</option>
      <option value="ja">日语</option>
      <option value="ko">韩语</option>
      <option value="fr">法语</option>
    </select>
  </div>

  <div class="row">
    <label>翻译成</label>
    <select id="targetLang">
      <option value="zh-CN">中文 (简体)</option>
      <option value="en">英语</option>
      <option value="ja">日语</option>
      <option value="ko">韩语</option>
    </select>
  </div>

  <button id="translateBtn">🚀 一键翻译全文</button>
  <button id="restoreBtn" class="btn-secondary">↩️ 恢复原文</button>
  
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
